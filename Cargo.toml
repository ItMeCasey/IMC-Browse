[package]
name = "imc-browse"
version = "0.1.0"
edition = "2024"
description = "Lightweight, privacy-first Windows browser on Chromium (CEF)"
publish = false

# The app is a DLL that CEF's bootstrap.exe (renamed imc-browse.exe) loads: that is what lets the
# Chromium sandbox be turned on. See tools/stage-cef.ps1.
[lib]
name = "imc_browse"
crate-type = ["cdylib"]

[dependencies]
cef = { version = "156.2", default-features = false, features = ["resources"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ed25519-dalek = "2"
tao = "0.37"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
