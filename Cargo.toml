[package]
name = "imc-browse"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
ed25519-dalek = "2"
tao = "0.37.2"
url = "2.5.8"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Console", "Win32_Security_Cryptography"] }
wry = "0.57.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
