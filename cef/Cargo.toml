[package]
name = "imc-browse-cef"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone crate: keeps the CEF build out of the WebView2 build.
[workspace]

[dependencies]
cef = { version = "156.2", default-features = false, features = ["resources"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
tao = "0.37"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
